name: Verify Buyer Signal Radar

on:
  push:
    paths:
      - "raw-signals.json"
      - "signals.json"
      - "scripts/build-signals.js"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild radar data
        run: node scripts/build-signals.js
      - name: Verify generated data is committed
        run: git diff --exit-code -- signals.json
